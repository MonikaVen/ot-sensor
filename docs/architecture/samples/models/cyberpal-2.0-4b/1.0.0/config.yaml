# CyberPal investigation assistant. Not a detector.
# Official cyber-pal-security/CyberPal2.0-4B is not published (20B only).
# Lab default: smallest local Ollama SLM (qwen2:1.5b) aliased as cyberpal.

model_id: cyberpal
version: 1.0.0
runtime: ollama
ollama_model: cyberpal
ollama_from: qwen2:1.5b
ctx: 2048
max_new_tokens: 180
timeout_s: 45
fail: closed
prod_network: deny
no_ground_truth: true
no_raw_can: true
no_honeypot_blobs: true
hardware:
  ram_gb_min: 4
  gpu: optional
