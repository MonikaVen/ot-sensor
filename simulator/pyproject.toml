[project]
name = "opv-sim"
version = "0.1.0"
description = "OPV NMEA 2000 simulator (in-memory CAN lab)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
opv-sim = "opv_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otlab", "src/opv_sim"]
