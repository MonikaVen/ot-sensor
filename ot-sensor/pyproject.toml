[project]
name = "ot-sensor"
version = "0.1.0"
description = "Listen-only OT sensor for NMEA 2000"
requires-python = ">=3.12"
dependencies = [
  "opv-sim",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
ui = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.scripts]
ot-sensor = "ot_sensor.cli:main"
ot-dashboard = "ot_sensor.dashboard_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ot_sensor"]

[tool.uv.sources]
opv-sim = { workspace = true }
