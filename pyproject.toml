[project]
name = "ot-lab"
version = "0.1.0"
description = "OPV NMEA 2000 lab: simulator + OT sensor"
requires-python = ">=3.12"
dependencies = [
  "opv-sim",
  "ot-sensor[onnx,ui]",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false
default-groups = ["dev"]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["simulator", "ot-sensor"]

[tool.uv.sources]
opv-sim = { workspace = true }
ot-sensor = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["simulator/tests", "ot-sensor/tests"]
