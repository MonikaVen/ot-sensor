[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ot-sensor"
version = "0.1.0"
description = "OPV NMEA 2000 simulator and OT sensor"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
ui = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
opv-sim = "opv_sim.cli:main"
ot-sensor = "ot_sensor.cli:main"
ot-dashboard = "ot_sensor.dashboard_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
